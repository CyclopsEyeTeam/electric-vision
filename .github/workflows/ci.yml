name: Electric Vision CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify-electric-vision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system media & test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m pip install --upgrade pip Pillow python-xlib

      - name: Enable unprivileged user namespaces for Linux Enclave Isolation Test
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Verify Native C11/AVX2 SIMD Build & Shipped Enclave Binary
        run: |
          make build
          make verify-c-compile

      - name: Run Full Electric Vision Test Suite
        run: make test

      - name: Run Standalone CLI Self-Test (NO_COLOR + Plain 7-bit ASCII)
        run: make selftest
